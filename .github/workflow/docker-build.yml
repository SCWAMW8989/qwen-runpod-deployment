# Place at: .github/workflows/docker-build.yml
name: Build and push RunPod image

on:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker Hub login is case-sensitive on username -- confirmed
      # against long-documented Docker forum reports of exactly this
      # "unauthorized: incorrect username or password" failure whenever
      # a mixed-case username is submitted, even though the account's
      # actual Hub ID is stored lowercase. Normalize BEFORE the login
      # step, not just before the image-tag step, since login happens
      # first and fails the whole job if it's wrong there.
      - name: Normalize Docker Hub username to lowercase
        env:
          RAW_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "DOCKERHUB_USER=$(echo "$RAW_DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fixed: this step previously used the RAW (un-normalized) secret
      # for the username field, which defeats the normalization step
      # above entirely -- login would fail on a mixed-case username
      # before the workflow ever reached the tag step the fix was
      # originally built for. Now uses the same normalized value.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/qwen-heretic-runpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
