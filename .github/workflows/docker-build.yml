# Place at: .github/workflows/docker-build.yml
name: Build and push RunPod image

on:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker repository names must be entirely lowercase --
      # "invalid reference format: repository name must be lowercase"
      # is a real, well-documented Docker error if a GitHub secret
      # happens to contain mixed-case characters (e.g. copy-pasted from
      # a display name rather than the actual Hub username). Normalize
      # unconditionally so this never surfaces as a confusing CI failure.
      - name: Normalize Docker Hub username to lowercase
        run: |
          echo "DOCKERHUB_USER=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/qwen-heretic-runpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
